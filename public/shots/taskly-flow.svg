<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#111"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6B675F"/></marker>
  </defs>
  <rect width="1200" height="520" fill="#F3EFE7"/>
  <text x="60" y="70" font-family="Consolas, monospace" font-size="15" fill="#6B675F" letter-spacing="2">FLUJO DE DATOS — TASKLY</text>

  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="60" y="170" width="200" height="110" rx="18" fill="#C8F169" stroke="#111" stroke-width="2"/>
    <text x="160" y="218" font-weight="700" font-size="20" fill="#111">Usuario</text>
    <text x="160" y="246" font-family="Consolas, monospace" font-size="14" fill="#111">submit · click</text>

    <rect x="340" y="170" width="220" height="110" rx="18" fill="#FBF9F4" stroke="#111" stroke-width="2"/>
    <text x="450" y="218" font-weight="700" font-size="20" fill="#111">setTodos()</text>
    <text x="450" y="246" font-family="Consolas, monospace" font-size="14" fill="#6B675F">copia inmutable</text>

    <rect x="640" y="170" width="220" height="110" rx="18" fill="#111"/>
    <text x="750" y="218" font-weight="700" font-size="20" fill="#F3EFE7">Estado React</text>
    <text x="750" y="246" font-family="Consolas, monospace" font-size="14" fill="#C8F169">todos[ ]</text>

    <rect x="940" y="170" width="200" height="110" rx="18" fill="#FBF9F4" stroke="#111" stroke-width="2"/>
    <text x="1040" y="218" font-weight="700" font-size="20" fill="#111">localStorage</text>
    <text x="1040" y="246" font-family="Consolas, monospace" font-size="14" fill="#6B675F">JSON.stringify</text>
  </g>

  <line x1="262" y1="225" x2="334" y2="225" stroke="#111" stroke-width="2" marker-end="url(#a)"/>
  <line x1="562" y1="225" x2="634" y2="225" stroke="#111" stroke-width="2" marker-end="url(#a)"/>
  <line x1="862" y1="225" x2="934" y2="225" stroke="#111" stroke-width="2" marker-end="url(#a)"/>
  <text x="898" y="208" font-family="Consolas, monospace" font-size="12" fill="#111" text-anchor="middle">useEffect</text>

  <!-- re-render back to UI -->
  <path d="M750 282 C750 380 160 380 160 286" fill="none" stroke="#111" stroke-width="2" marker-end="url(#a)"/>
  <text x="455" y="370" font-family="Consolas, monospace" font-size="13" fill="#111" text-anchor="middle">re-render de la lista</text>

  <!-- initial load -->
  <path d="M1040 168 C1040 100 750 100 750 164" fill="none" stroke="#6B675F" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#b)"/>
  <text x="895" y="104" font-family="Consolas, monospace" font-size="13" fill="#6B675F" text-anchor="middle">lectura inicial (useState perezoso)</text>

  <text x="60" y="460" font-family="Arial, sans-serif" font-size="16" fill="#6B675F">Un único hook, <tspan font-family="Consolas, monospace" fill="#111">useLocalStorage(key, initial)</tspan>, encapsula la lectura y la escritura con try/catch.</text>
</svg>
